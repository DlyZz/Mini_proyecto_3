# ─────────────────────────────────────────────────────────────────────────────
# CI/CD — Telco Churn Prediction API
#
# Flujo:
#   1. Lint (ruff)         → calidad del código
#   2. Test (pytest)       → pruebas unitarias + cobertura
#   3. Build & Push        → imagen Docker a GitHub Container Registry (ghcr.io)
#                            solo en push a main con tests exitosos
# ─────────────────────────────────────────────────────────────────────────────

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  # Nombre de la imagen en ghcr.io (usa el repo automáticamente)
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/telco-churn-api
  PYTHON_VERSION: "3.11"

jobs:
  # ───────────────────────────────────────────────────────────
  # JOB 1: Linting con Ruff
  # ───────────────────────────────────────────────────────────
  lint:
    name: 🔍 Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Instalar ruff
        run: pip install ruff==0.4.4

      - name: Verificar estilo y errores (ruff check)
        run: ruff check app/ tests/

      - name: Verificar formato (ruff format)
        run: ruff format --check app/ tests/

  # ───────────────────────────────────────────────────────────
  # JOB 2: Pruebas unitarias con pytest
  # ───────────────────────────────────────────────────────────
  test:
    name: 🧪 Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint   # Solo corre si lint pasa

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas con cobertura
        run: |
          pytest tests/ \
            --tb=short \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80 \
            -v

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()   # sube el reporte aunque falle
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

      # Comentario automático de cobertura en PRs
      - name: Comentar cobertura en PR
        if: github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-xml-coverage-path: coverage.xml

  # ───────────────────────────────────────────────────────────
  # JOB 3: Build y Push de imagen Docker
  # Solo se ejecuta en push a main, después de que tests pasen
  # ───────────────────────────────────────────────────────────
  build-and-push:
    name: 🐳 Build & Push Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write   # necesario para publicar en ghcr.io

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx (build multi-plataforma)
        uses: docker/setup-buildx-action@v3

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Genera tags automáticos: latest + SHA del commit
      - name: Extraer metadatos Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build y Push imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache entre builds para acelerar el proceso
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen del deploy
        run: |
          echo "## 🚀 Deploy exitoso" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Imagen publicada:** \`${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Para usar la imagen:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "docker run -p 8000:8000 -v \$(pwd)/app/model.joblib:/service/app/model.joblib ${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
